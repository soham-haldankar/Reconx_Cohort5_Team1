# ============================================================================
# Grafana dashboard provisioning (TICKET-ADV150)
# Loads all dashboard JSONs from /etc/grafana/provisioning/dashboards
# ============================================================================

apiVersion: 1
providers:
  - name: reconx
    orgId: 1
    folder: 'ReconX'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards